<!doctype html>
<!--
  A bare page for trying the browser build without the real page.
  tools/build_web.sh copies it to web/game/test.html; with `node server/dev.mjs`
  running it is at http://localhost:<port>/game/test.html.

  It starts the game on the house table, shows the floating text over the
  canvas, and keeps every message from the game in `window.received`.
  Add ?demo to the address to have the bundled demo Flipper program play.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinball Arena: game test page</title>
<style>
  html, body { margin: 0; height: 100%; background: #05040c; color: #cde; font: 13px monospace; }
  #frame { position: absolute; top: 0; bottom: 0; left: 0; width: 60%; }
  #table { position: relative; height: 100%; aspect-ratio: 0.62; margin: 0 auto; max-width: 100%; }
  #canvas { display: block; width: 100%; height: 100%; outline: none; }
  #floating span { position: absolute; transform: translate(-50%, -50%); font-weight: bold;
                   white-space: nowrap; text-shadow: 0 0 6px #000; pointer-events: none; }
  #log { position: absolute; top: 0; bottom: 0; right: 0; width: 40%; overflow: auto;
         margin: 0; padding: 8px; box-sizing: border-box; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="frame"><div id="table">
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="floating"></div>
</div></div>
<pre id="log"></pre>
<script>
  var received = [];
  var log = document.getElementById('log');
  var floating = document.getElementById('floating');
  var gameArguments = new URLSearchParams(location.search).has('demo') ? ['--demo'] : [];
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: gameArguments,
    pinballInbox: [],
    pinballMessage: function (json) {
      var message = JSON.parse(json);
      received.push(message);
      if (message.type === 'floating') {
        floating.replaceChildren.apply(floating, message.items.map(function (item) {
          var span = document.createElement('span');
          span.textContent = item.text;
          span.style.left = (item.x * 100) + '%';
          span.style.top = (item.y * 100) + '%';
          span.style.color = item.colour;
          return span;
        }));
      } else {
        log.textContent = json + '\n' + log.textContent.slice(0, 4000);
      }
    },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); }
  };
</script>
<script src="pinball.js"></script>
</body>
</html>
