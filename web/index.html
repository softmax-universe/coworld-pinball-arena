<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinball Arena</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/Doto-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body data-chat="closed">
    <main class="stage">
      <header class="marquee">
        <h1><i class="orbit-mark" aria-hidden="true"></i>Pinball <em>Arena</em></h1>
      </header>
      <div class="cabinet">
        <div class="table-area">
          <div class="table">
            <canvas id="canvas" tabindex="0" aria-label="Pinball table" oncontextmenu="event.preventDefault()"></canvas>
            <p class="table-notice" id="table-notice">LOADING TABLE</p>
            <div class="end-screen" id="end-screen" hidden>
              <p class="end-title">GAME OVER</p>
              <p class="end-label">FINAL SCORE</p>
              <div class="score end-score" id="end-score" role="img"></div>
              <button type="button" class="lamp-button" id="play-again">PLAY AGAIN</button>
            </div>
          </div>
        </div>
        <div class="station">
          <aside class="console" aria-label="Machine display">
            <div class="readout">
              <div class="readout-head"><span class="label">Score</span><span id="ball-line">BALL 1 OF 3</span></div>
              <div class="score" id="score" role="img" aria-label="Score 0"></div>
              <div class="status-line"><span class="flags" id="flags"></span><span id="clock">CLOCK -:-- LEFT</span></div>
            </div>
            <button type="button" class="music-cycle" id="music-cycle" title="Cycle background music">♫ Music · Off</button>
            <audio id="soundtrack" loop preload="none"></audio>
            <div class="mode-switch">
              <button type="button" id="chat-close" aria-controls="game-display" aria-pressed="true">Table</button>
              <button type="button" id="chat-open" aria-controls="chat" aria-pressed="false">Cogent</button>
            </div>
            <section class="game-display" id="game-display" aria-label="Table status">
              <div class="message message-quest"><h2 class="label">Quest</h2><p id="quest"></p></div>
              <div class="message message-award"><h2 class="label">Last award</h2><p id="award"></p></div>
              <dl class="keys" aria-label="Keyboard controls">
                <div><dt>Flippers</dt><dd><kbd>Z</kbd> <kbd>/</kbd></dd></div>
                <div><dt>Plunger</dt><dd><kbd>Space</kbd></dd></div>
                <div><dt>Nudge</dt><dd><kbd>X</kbd> <kbd>.</kbd> <kbd>↑</kbd></dd></div>
              </dl>
              <div class="table-controls">
                <label class="label" for="table-script">Table script</label>
                <select id="table-script"></select>
                <button type="button" class="lamp-button" id="restart-game">Restart game</button>
              </div>
              <button type="button" class="demo-toggle" id="demo-toggle" aria-pressed="false">Watch demo</button>
            </section>
          </aside>
          <section class="chat" id="chat" aria-labelledby="terminal-title">
            <h2 class="terminal-title" id="terminal-title"><span aria-hidden="true">&gt;_</span> Cogent terminal</h2>
            <section class="conversation" id="conversation" hidden>
              <div class="cogent-state">
                <p id="cogent-state" role="status"></p>
                <button type="button" class="quiet-button" id="try-again" hidden>Try again</button>
              </div>
              <div class="chat-log" id="chat-log" aria-live="polite"></div>
              <div class="chat-asks" id="chat-asks"></div>
              <form class="composer" id="composer">
                <label class="visually-hidden" for="chat-text">Message to your cogent</label>
                <textarea id="chat-text" rows="2" placeholder="Ask for a table: more ramps, a harder quest…"></textarea>
                <button type="submit" class="send-button">Send</button>
              </form>
              <p class="account"><span id="account-email"></span> <button type="button" class="quiet-button" id="sign-out">Sign out</button></p>
            </section>

            <section class="signed-out" id="signed-out" hidden>
              <button type="button" class="sign-in" id="sign-in">Connect with Softmax</button>
            </section>

            <div class="program-notice" id="program-notice" role="status" hidden>
              <p class="program-notice-title" id="program-notice-title"></p>
              <p class="program-notice-detail" id="program-notice-detail"></p>
              <button type="button" class="lamp-button" id="restart-now">RESTART NOW</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
